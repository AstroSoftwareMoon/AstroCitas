name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright (E2E)
        run: |
          pnpm --filter @astrocitas/web exec playwright install --with-deps chromium
          pnpm e2e -- --trace off
      - uses: actions/upload-artifact@v4
        with:
          name: astrocitas-web
          path: apps/web/dist
